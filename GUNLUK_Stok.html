<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN Ürün Stok Raporu | Profesyonel Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --navy: #0a3d62; --white: #ffffff; --danger: #eb4d4b;
            --warning: #f1c40f; --success: #2ecc71; --info-blue: #0984e3;
            --sidebar-width: 320px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-width); background: var(--navy); color: var(--white); display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 25px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { color: #60a3bc; font-size: 20px; text-transform: uppercase; }
        
        .upload-btn {
            background: #3c6382; color: white; border: 2px dashed rgba(255,255,255,0.3); padding: 15px; margin: 20px;
            border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600; transition: 0.3s;
        }
        .upload-btn:hover { background: var(--info-blue); border-color: white; }

        .sidebar-label { padding: 10px 20px; font-size: 11px; color: #60a3bc; text-transform: uppercase; font-weight: 800; }
        .product-list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .product-item {
            padding: 10px 15px; margin-bottom: 4px; border-radius: 8px; font-size: 12px;
            cursor: pointer; color: rgba(255,255,255,0.7); display: flex; align-items: center; gap: 10px;
        }
        .product-item:hover, .product-item.active { background: rgba(255,255,255,0.15); color: white; }
        .product-item.active { background: var(--info-blue); font-weight: 600; }

        /* MAIN CONTENT */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .web-frame { width: 100%; height: 180px; border-bottom: 3px solid var(--navy); background: #fff; }
        
        .top-bar { background: white; padding: 0 30px; height: 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .top-info { display: flex; align-items: center; gap: 20px; font-size: 13px; font-weight: 600; }
        
        .view-area { padding: 30px; overflow: auto; flex: 1; }
        
        /* ARAMA MOTORU (TABLO ÜSTÜ) */
        .table-controls { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .search-wrapper { position: relative; flex: 1; }
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #95a5a6; }
        .main-search { 
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 10px; border: 1px solid #dfe6e9; 
            font-size: 14px; outline: none; transition: 0.3s; background: white;
        }
        .main-search:focus { border-color: var(--info-blue); box-shadow: 0 0 10px rgba(9, 132, 227, 0.1); }

        .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .export-btn { padding: 10px 20px; border-radius: 8px; border: none; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; background: #27ae60; }

        .table-card { background: white; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .data-table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        .data-table th { background: #f8f9fa; padding: 18px 15px; text-align: left; font-size: 11px; font-weight: 800; color: #636e72; border-bottom: 2px solid #dfe6e9; }
        .data-table td { padding: 15px; border-bottom: 1px solid #f1f2f6; font-size: 13px; color: #2d3436; }

        .st-out { background-color: #eb4d4b; color: white; }
        .st-critical { background-color: #f1c40f; color: #000; }
        .st-safe { background-color: #2ecc71; color: white; }
        .badge { padding: 5px 10px; border-radius: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>GEN GLOBAL</h2>
            <small style="opacity: 0.7;">Stok Takip v2.5</small>
        </div>
        
        <input type="file" id="excelInput" style="display:none" accept=".xlsx, .xls">
        <div class="upload-btn" onclick="document.getElementById('excelInput').click()">
            <i class="fas fa-upload"></i> EXCEL VERİ YÜKLE
        </div>

        <div id="filterSection" style="display:none;">
            <div class="sidebar-label">Durum Filtreleri</div>
            <div class="product-item active" id="btnAll" onclick="app.filterByStatus('ALL', this)">
                <i class="fas fa-list"></i> Tüm Ürünler
            </div>
            <div class="product-item" onclick="app.filterByStatus('OUT', this)">
                <i class="fas fa-times-circle" style="color:var(--danger)"></i> Stok Out
            </div>
            <div class="product-item" onclick="app.filterByStatus('CRITICAL', this)">
                <i class="fas fa-exclamation-triangle" style="color:var(--warning)"></i> Kritik Stok
            </div>
            <div class="product-item" onclick="app.filterByStatus('SAFE', this)">
                <i class="fas fa-check-circle" style="color:var(--success)"></i> Güvenli Stok
            </div>
        </div>

        <div class="sidebar-label">Ürün Listesi</div>
        <div class="product-list-container" id="productList"></div>
    </div>

    <div class="main-content">
        <iframe src="https://www.genilac.com.tr/" class="web-frame"></iframe>

        <div class="top-bar">
            <div style="color: var(--navy); font-weight: 700;"><i class="fas fa-chart-pie"></i> CANLI VERİ İZLEME</div>
            <div class="top-info">
                <span id="liveClock"></span>
                <button onclick="location.reload()" style="background:none; border:none; cursor:pointer; color:var(--danger); font-weight:700;">PANELİ TEMİZLE</button>
            </div>
        </div>

        <div class="view-area">
            <div class="table-controls" id="mainControls" style="display:none;">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="mainSearchInput" class="main-search" placeholder="Ürün adı veya kodu ile hızlı ara..." onkeyup="app.handleSearch()">
                </div>
                <button id="excelBtn" class="export-btn" onclick="app.exportToExcel()">
                    <i class="fas fa-file-excel"></i> EXCEL İNDİR
                </button>
            </div>

            <div class="action-header">
                <div>
                    <h2 id="currentViewTitle" style="color: var(--navy);">Veri bekleniyor...</h2>
                    <p id="statsText" style="font-size: 12px; color: #7f8c8d;"></p>
                </div>
            </div>

            <div class="table-card">
                <table class="data-table" id="stockTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let fullData = [];
        let tableHeaders = [];
        let currentFilteredData = [];

        const app = {
            init: function() {
                document.getElementById('excelInput').addEventListener('change', this.handleFile);
                this.updateTime();
            },

            updateTime: function() {
                const now = new Date();
                document.getElementById('liveClock').innerText = now.toLocaleString('tr-TR');
                setTimeout(() => this.updateTime(), 1000);
            },

            cleanSidebarName: function(text) {
                if(!text) return "";
                return String(text).replace(/^[0-9\s.-]+/, '').trim();
            },

            handleFile: function(e) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const workbook = XLSX.read(new Uint8Array(event.target.result), {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    let rawData = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});
                    
                    if(rawData.length > 0) {
                        let headerRowIndex = 0;
                        for(let i = 0; i < rawData.length; i++) {
                            const rowStr = rawData[i].join("|").toUpperCase();
                            if(rowStr.includes("MALZEME") || rowStr.includes("STOK") || rowStr.includes("ÜRÜN")) {
                                headerRowIndex = i;
                                break;
                            }
                        }

                        tableHeaders = rawData[headerRowIndex].map(h => String(h || "").trim());
                        let jsonData = XLSX.utils.sheet_to_json(sheet, {range: headerRowIndex});
                        
                        fullData = jsonData.filter(row => {
                            const firstVal = String(Object.values(row)[0]).toUpperCase();
                            return !firstVal.includes("MALZEME KODU") && !firstVal.includes("MALZEME İSMİ");
                        });

                        currentFilteredData = [...fullData];

                        document.getElementById('filterSection').style.display = 'block';
                        document.getElementById('mainControls').style.display = 'flex';
                        document.getElementById('currentViewTitle').innerText = "Tüm Ürün Listesi";
                        
                        app.renderSidebar(fullData);
                        app.renderTable(fullData);
                    }
                };
                reader.readAsArrayBuffer(e.target.files[0]);
            },

            renderTable: function(data, element) {
                if(element) {
                    document.querySelectorAll('.product-item').forEach(i => i.classList.remove('active'));
                    element.classList.add('active');
                }

                const head = document.getElementById('tableHead');
                const body = document.getElementById('tableBody');
                const stokKey = tableHeaders.find(h => h.toUpperCase().includes("STOK")) || tableHeaders[0];

                head.innerHTML = `<tr>${tableHeaders.map(h => `<th>${h}</th>`).join('')}<th>DURUM ANALİZİ</th></tr>`;
                
                body.innerHTML = data.map(row => {
                    const val = parseFloat(row[stokKey]) || 0;
                    let badgeCls = val === 0 ? 'st-out' : (val <= 30 ? 'st-critical' : 'st-safe');
                    let badgeTxt = val === 0 ? 'STOKTA YOK' : (val <= 30 ? 'KRİTİK SEVİYE' : 'GÜVENLİ');
                    
                    return `<tr>
                        ${tableHeaders.map(h => `<td>${row[h] === undefined || row[h] === "" ? "0" : row[h]}</td>`).join('')}
                        <td><span class="badge ${badgeCls}">${badgeTxt}</span></td>
                    </tr>`;
                }).join('');

                document.getElementById('statsText').innerText = `Şu an ${data.length} kayıt listeleniyor.`;
            },

            renderSidebar: function(data) {
                const list = document.getElementById('productList');
                const nameKey = tableHeaders.find(h => h.toUpperCase().includes("MALZEME") || h.toUpperCase().includes("ÜRÜN")) || tableHeaders[0];
                const rawNames = [...new Set(data.map(i => i[nameKey]))].filter(Boolean);
                
                list.innerHTML = rawNames.map(originalName => {
                    const displayName = app.cleanSidebarName(originalName);
                    return `
                        <div class="product-item" onclick="app.filterByProduct('${originalName.replace(/'/g, "\\'")}', '${nameKey}', this)">
                            <i class="fas fa-pills"></i> ${displayName}
                        </div>
                    `;
                }).join('');
            },

            handleSearch: function() {
                const query = document.getElementById('mainSearchInput').value.toLowerCase('tr-TR');
                const filtered = currentFilteredData.filter(row => {
                    return Object.values(row).some(val => 
                        String(val).toLowerCase('tr-TR').includes(query)
                    );
                });
                this.renderTable(filtered);
            },

            filterByProduct: function(name, key, el) {
                const filtered = fullData.filter(i => String(i[key]) === String(name));
                document.getElementById('currentViewTitle').innerText = app.cleanSidebarName(name);
                this.renderTable(filtered, el);
            },

            filterByStatus: function(type, el) {
                const stokKey = tableHeaders.find(h => h.toUpperCase().includes("STOK")) || tableHeaders[0];
                let title = "";

                if(type === 'ALL') {
                    currentFilteredData = [...fullData];
                    title = "Tüm Ürün Listesi";
                } else if(type === 'OUT') {
                    currentFilteredData = fullData.filter(i => (parseFloat(i[stokKey]) || 0) === 0);
                    title = "Stokta Olmayan Ürünler";
                } else if(type === 'CRITICAL') {
                    currentFilteredData = fullData.filter(i => {
                        const v = parseFloat(i[stokKey]) || 0;
                        return v > 0 && v <= 30;
                    });
                    title = "Acil Tedarik Gerekenler (Kritik)";
                } else if(type === 'SAFE') {
                    currentFilteredData = fullData.filter(i => (parseFloat(i[stokKey]) || 0) > 30);
                    title = "Stok Sorunu Olmayanlar";
                }

                document.getElementById('currentViewTitle').innerText = title;
                document.getElementById('mainSearchInput').value = ""; // Filtre değişince aramayı sıfırla
                this.renderTable(currentFilteredData, el);
            },

            exportToExcel: function() {
                const ws = XLSX.utils.table_to_sheet(document.getElementById('stockTable'));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "GEN_Rapor");
                XLSX.writeFile(wb, "GEN_Global_Guncel_Stok.xlsx");
            }
        };

        app.init();
    </script>
</body>
</html>
